[project]
name = "niu-controller-backend"
version = "1.0.0"
description = "NIU electric scooter controller backend - proxy for NIU Cloud API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "idna>=3.15",
    "pydantic>=2.0.0",
    "joserfc>=1.0.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
